[project]
name = "xianyu-core-backend"
version = "0.1.0"
description = "闲鱼自动化系统后端（FastAPI 单体）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiomysql>=0.2",
    "alembic>=1.13",
    "redis>=5.0",
    "httpx>=0.27",
    "websockets>=12",
    "msgpack>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cryptography>=42",
    "qrcode[pil]>=7.4",
    "playwright>=1.45",
    "PyJWT>=2.8",
    "bcrypt>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
